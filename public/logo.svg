<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded hexagon or shield -->
  <rect x="15" y="15" width="170" height="170" rx="42" fill="url(#diceGrad)" stroke="#334155" stroke-width="4" />

  <!-- 4 Colored Ludo Quarters -->
  <path d="M 30 30 L 95 30 L 95 95 L 30 95 Z" fill="#EF4444" rx="8" opacity="0.95" />
  <circle cx="62" cy="62" r="14" fill="#FFFFFF" opacity="0.9" />

  <path d="M 105 30 L 170 30 L 170 95 L 105 95 Z" fill="#10B981" rx="8" opacity="0.95" />
  <circle cx="138" cy="62" r="14" fill="#FFFFFF" opacity="0.9" />

  <path d="M 30 105 L 95 105 L 95 170 L 30 170 Z" fill="#06B6D4" rx="8" opacity="0.95" />
  <circle cx="62" cy="138" r="14" fill="#FFFFFF" opacity="0.9" />

  <path d="M 105 105 L 170 105 L 170 170 L 105 170 Z" fill="#F59E0B" rx="8" opacity="0.95" />
  <circle cx="138" cy="138" r="14" fill="#FFFFFF" opacity="0.9" />

  <!-- Center Golden Star / Crown Badge -->
  <circle cx="100" cy="100" r="28" fill="url(#goldGrad)" filter="url(#glow)" stroke="#FFFFFF" stroke-width="2" />
  <path d="M 100 84 L 104 94 L 115 94 L 106 101 L 109 112 L 100 105 L 91 112 L 94 101 L 85 94 L 96 94 Z" fill="#1C1200" />
</svg>
